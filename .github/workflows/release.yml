name: Release

# The whole release runs without a click once the release PR is merged:
#
#   1. release-please keeps a "chore(master): release X.Y.Z" PR open. It
#      reads the Conventional Commits on master (feat -> minor, fix -> patch
#      while the version is 0.x) and writes the version and CHANGELOG.md.
#   2. Merging that PR makes release-please tag vX.Y.Z and create the
#      GitHub release as a draft, with the CHANGELOG section as its notes.
#   3. The installers are built on macOS, Windows and Linux, and every
#      packaged app is launched once in smoke-test mode (scripts/smoke.mjs).
#   4. Only when all three pass are the installers attached and the release
#      published. electron-updater only sees published releases, so a failed
#      build or smoke test never reaches a user: the release stays a draft.

on:
    push:
        branches: [master]
    # Builds, tests and publishes an existing draft again, e.g. after a
    # flaky runner failed the first attempt.
    workflow_dispatch:
        inputs:
            tag:
                description: The draft release to build, test and publish (vX.Y.Z)
                required: true

jobs:
    release-please:
        name: Release PR
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            created: ${{ steps.release.outputs.release_created }}
            tag: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    build:
        name: Build and smoke test (${{ matrix.os }})
        needs: release-please
        if: >-
            always() &&
            (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [macos-latest, windows-latest, ubuntu-latest]
        env:
            # Absent secrets build unsigned; signing joins later without a
            # code change.
            CSC_LINK: ${{ secrets.CSC_LINK }}
            CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
            APPLE_ID: ${{ secrets.APPLE_ID }}
            APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-please.outputs.tag || inputs.tag }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - run: npm test
            - run: npm run build
            - name: Package the installers
              # A missing secret arrives as an empty string, and electron-builder
              # reads an empty CSC_LINK as a path - unset the empty ones.
              shell: bash
              run: |
                  for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
                      [ -n "${!v}" ] || unset "$v"
                  done
                  npm run package
            - name: Smoke test the packaged app
              if: matrix.os != 'ubuntu-latest'
              run: npm run smoke
            - name: Smoke test the packaged app (virtual display)
              if: matrix.os == 'ubuntu-latest'
              # An installed Electron app has a root-owned setuid sandbox
              # helper; the unpacked build on the runner does not, and
              # Chromium refuses to start without it.
              run: |
                  sudo chown root:root release/linux-unpacked/chrome-sandbox
                  sudo chmod 4755 release/linux-unpacked/chrome-sandbox
                  xvfb-run -a npm run smoke
            - name: Upload the installers
              uses: actions/upload-artifact@v7
              with:
                  name: brooz-${{ matrix.os }}
                  # The installers and the updater feeds, not the unpacked apps.
                  path: |
                      release/*.dmg
                      release/*.zip
                      release/*.exe
                      release/*.AppImage
                      release/*.blockmap
                      release/latest*.yml
                  if-no-files-found: error

    publish:
        name: Publish the release
        needs: [release-please, build]
        if: always() && needs.build.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        env:
            TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            - name: Download the installers
              uses: actions/download-artifact@v7
              with:
                  pattern: brooz-*
                  path: release
                  merge-multiple: true
            - name: Attest the binaries
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: release/*
            - name: Attach the installers to the draft
              run: gh release upload "$TAG" release/* --clobber
            - name: Publish
              # From here on users see the download and the updater offers it.
              run: gh release edit "$TAG" --draft=false --latest
