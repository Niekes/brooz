name: CI

on:
    - pull_request
    - push

jobs:
    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - run: npm run typecheck

    template:
        name: App Template
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  # Fallow resolves the template rules against the changed
                  # files, so the history has to be there.
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - name: Check the app template
              run: npm run lint
              env:
                  # Report the findings as inline annotations on the pull
                  # request instead of a wall of text in the log.
                  FALLOW_FORMAT: github-annotations

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  # One Node version: Electron ships its own.
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            # Fails when the coverage drops below the thresholds in vite.config.ts.
            - run: npm run coverage

    e2e:
        name: E2E (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [macos-latest, windows-latest, ubuntu-latest]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            # The suite launches `electron .`, which needs the bundles.
            - run: npm run build
            - name: Run the e2e suite
              run: npm run test:e2e
              if: matrix.os != 'ubuntu-latest'
            - name: Run the e2e suite (virtual display)
              run: xvfb-run -a npm run test:e2e
              if: matrix.os == 'ubuntu-latest'
            # Bundles the app without a disk image and launches the packaged
            # app once in smoke-test mode, the same check a release must pass.
            - run: npm run package -- --dir
            - name: Smoke test the packaged app
              if: matrix.os != 'ubuntu-latest'
              run: npm run smoke
            - name: Smoke test the packaged app (virtual display)
              if: matrix.os == 'ubuntu-latest'
              # An installed Electron app has a root-owned setuid sandbox
              # helper; the unpacked build on the runner does not, and
              # Chromium refuses to start without it.
              run: |
                  sudo chown root:root release/linux-unpacked/chrome-sandbox
                  sudo chmod 4755 release/linux-unpacked/chrome-sandbox
                  xvfb-run -a npm run smoke

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [typecheck, test, template]
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - name: Update the health and coverage badges
              if: github.ref == 'refs/heads/master' && github.event_name == 'push'
              run: |
                  npx fallow health --format badge > .github/badges/health.svg
                  npm run coverage
                  node scripts/coverage-badge.mjs
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .github/badges/health.svg .github/badges/coverage.json
                  git diff --quiet --cached || git commit -m "chore: update the health and coverage badges [skip ci]"
                  git push
